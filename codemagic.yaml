workflows:
  android-build:
    name: Android Build
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      groups:
        # Store KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in a UI group named 'keystore_credentials'
        - keystore_credentials
      vars:
        ANDROID_TOP_LEVEL_PROJECT_DIR: app
      flutter: stable
      java: 17
      ndk: 25.2.9519653
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Check Java version
        script: java -version
      - name: Build APK
        script: |
          cd $CM_BUILD_DIR
          ./gradlew assembleDebug
      - name: Locate APK
        script: |
          echo "APK path: $CM_BUILD_DIR/app/build/outputs/apk/debug/app-debug.apk"
          ls -la $CM_BUILD_DIR/app/build/outputs/apk/debug/
    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
