# Codemobile.yml configuration for Battery Manager App
# https://codemagic.amplifyapp.com/docs/

workflows:
  android-build:
    name: Android Build
    max-build-duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Set up JDK
        script: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $CM_ENV
          echo "export JAVA_HOME" >> $CM_ENV
          java -version

      - name: Build APK
        script: |
          cd $CM_PROJECT_DIR
          ./gradlew assembleDebug

      - name: Locate APK
        script: |
          echo "APK path: $CM_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          ls -la $CM_PROJECT_DIR/app/build/outputs/apk/debug/

      - name: Publish APK
        publisher:
          groupId: 12345
          artifactName: app-debug.apk
          email: build@codemagic.wmflabs.org

# Android specific configuration
android:
  sdk_version: 34
  ndk_version: 25.2.9519653
  build_tools_version: 36.1.0

# Environment variables
environment:
  JAVA_VERSION: 17
  ANDROID_TOP_LEVEL_PROJECT_DIR: app

# Publishing
publishers:
  firebase_app_distribution:
    app_id: "com.example.batterymanager"
    groups: "qa-testers"

  email_notifications:
    recipients:
      - build@codemagic.wmflabs.org

# Artifacts
artifacts:
  - app/build/outputs/**/*.apk
  - app/build/outputs/**/*.aab
  - build/**/*.zip

# Caching
cache:
  directories:
    - $CM_ROOT/.gradle/caches
    - $CM_ROOT/.gradle/wrapper
    - $CM_PROJECT_DIR/app/build

# Triggers
triggers:
  - type: manual
  - type: webhook
  - type: periodic_build
    interval: weekly

# Environment variables for signing
environment:
  variables:
    KEYSTORE_PASSWORD:
      value: ${KEYSTORE_PASSWORD}
      required: false
    KEY_ALIAS:
      value: ${KEY_ALIAS}
      required: false
    KEY_PASSWORD:
      value: ${KEY_PASSWORD}
      required: false